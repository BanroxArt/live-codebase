[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "livesvc"
version = "0.1.0"
description = "Reference service for making one codebase live: structured logs, tracing, health and readiness, metrics, feature flags with kill switches, purpose-scoped data access with consent checks, canary checks."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Art Akopian" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "hypothesis>=6.100"]
otel = ["opentelemetry-api>=1.20"]

[project.scripts]
livesvc = "livesvc.server:serve"
livesvc-canary = "livesvc.canary:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The formatter handles wrapping; long string literals are left alone.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true
