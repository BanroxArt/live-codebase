# Example deploy pipeline. Not active: copy it to .github/workflows/ in your
# service repo and replace the two "deploy" steps with your platform's CLI.
#
# Flow: test, build an image tagged with the commit, start a canary next to
# a fresh baseline, soak, compare, then promote or roll back. A person can
# stop it at any point by cancelling the run; nothing is promoted without
# the comparison passing.
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check . && python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: build and push
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --build-arg RELEASE="${GITHUB_SHA::12}" -t "$IMAGE" .
          docker push "$IMAGE"

  canary:
    needs: build
    runs-on: ubuntu-latest
    environment: production   # gate with required reviewers if you want a human in the loop
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: deploy canary and fresh baseline (replace with your platform)
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          echo "start 1 canary replica from $IMAGE and 1 baseline replica from the current release"
          echo "route 5% of traffic split evenly between them"
      - name: soak
        run: sleep 600
      - name: compare
        id: verdict
        env:
          BASELINE_METRICS: ${{ vars.BASELINE_METRICS_URL }}
          CANARY_METRICS: ${{ vars.CANARY_METRICS_URL }}
        run: |
          set +e
          livesvc-canary "$BASELINE_METRICS" "$CANARY_METRICS" --min-requests 300
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: promote or roll back (replace with your platform)
        env:
          CODE: ${{ steps.verdict.outputs.code }}
        run: |
          case "$CODE" in
            0) echo "promote: shift traffic 5% -> 25% -> 100% with a soak between steps" ;;
            1) echo "rollback: send canary traffic back to baseline, keep the image for debugging"; exit 1 ;;
            *) echo "hold: not enough traffic to decide; extend the soak or stop"; exit 1 ;;
          esac
